<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>
<title>Çetele</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Çetele">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Chivo+Mono:wght@700&display=swap">
<style>
/* Layout: tek ekran — üstte çetele sekmeleri, ortada makaralı gösterge, altta basma tuşu ya da gün çetelesi */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --fg:#1B1F1D; --muted:#5F6862; --line:#D3D8D2;
  --drum:#161A18; --drum-fg:#F3F2EA; --accent:#E8A21A; --accent-deep:#A86F0A; --accent-fg:#1B1F1D;
  --danger:#B93A27; --ok:#2E7A4C;
  --f-num:"Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-ui:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#1B1F1D; --fg:#E9ECE8; --muted:#97A19A; --line:#2E3431;
  --drum:#050606; --drum-fg:#F3F2EA; --accent:#F0AE2C; --accent-deep:#9A6408; --accent-fg:#141614;
  --danger:#E4664F; --ok:#5DC08A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#1B1F1D; --fg:#E9ECE8; --muted:#97A19A; --line:#2E3431;
  --drum:#050606; --drum-fg:#F3F2EA; --accent:#F0AE2C; --accent-deep:#9A6408; --accent-fg:#141614;
  --danger:#E4664F; --ok:#5DC08A; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{box-sizing:border-box;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px}

.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none;margin-inline:-2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;max-width:60vw}
.tab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .n{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] .n{color:var(--accent)}
.tab.add{color:var(--muted);border-style:dashed;background:transparent}

.head{display:flex;flex-direction:column;gap:4px;flex:none}
.headtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface)}
.seg button{border:none;background:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.name{font:700 24px/1.2 var(--f-ui);background:none;border:none;border-bottom:1px dashed transparent;color:var(--fg);
  padding:2px 0;width:100%;-webkit-user-select:text;user-select:text;border-radius:0}
.name:focus{outline:none;border-bottom-color:var(--muted)}

.meter{flex:none;position:relative;background:var(--drum);border-radius:16px;padding:14px 12px;display:flex;justify-content:center;gap:6px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.65),0 1px 0 var(--line)}
.cell{--h:clamp(70px,24vw,104px);width:calc(var(--h)*.66);height:var(--h);overflow:hidden;border-radius:6px;position:relative;background:#1E2321}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0) 30%,rgba(255,255,255,.04) 50%,rgba(0,0,0,0) 70%,rgba(0,0,0,.7))}
.strip{transform:translateY(calc(var(--d,0) * -1 * var(--h)));transition:transform .32s cubic-bezier(.25,1.3,.5,1)}
.strip span{height:var(--h);display:grid;place-items:center;font:700 calc(var(--h)*.62)/1 var(--f-num);color:var(--drum-fg)}
.meter::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:rgba(0,0,0,.55)}

.sub{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex:none;margin-top:-6px;font-variant-numeric:tabular-nums}
.sub #unit{font-weight:700;color:var(--fg);letter-spacing:.06em;text-transform:uppercase;font-size:12px}

.goal{display:flex;flex-direction:column;gap:8px;flex:none}
.goalrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.goalrow label{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.04em}
.goalrow input{font:700 16px var(--f-num);border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:10px;padding:7px 9px;-webkit-user-select:text;user-select:text;box-sizing:border-box;min-height:38px}
#target{width:92px;text-align:right}
#start{font-family:var(--f-ui);font-weight:600;font-size:15px}
.goalrow input::placeholder{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.goal.done .bar i{background:var(--ok)}
.goal.done #left{color:var(--ok);font-weight:700}

.press{flex:1 1 auto;min-height:140px;border:none;border-radius:28px;background:var(--accent);color:var(--accent-fg);
  font:700 clamp(56px,18vw,84px)/1 var(--f-num);box-shadow:0 8px 0 var(--accent-deep);transform:translateY(0);
  transition:transform .06s,box-shadow .06s;margin-bottom:8px;display:grid;place-content:center;gap:6px}
.press small{font:600 13px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.press:active,.press.down{transform:translateY(8px);box-shadow:0 0 0 var(--accent-deep)}
.press:disabled{opacity:.45;transform:none;box-shadow:0 8px 0 var(--accent-deep);cursor:default}

.days{flex:1 1 auto;min-height:120px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(24px,1fr));gap:6px;align-content:start}
.days i{aspect-ratio:1;border-radius:6px;background:var(--line);display:grid;place-items:center;font:700 10px var(--f-num);color:var(--muted);font-style:normal}
.days i.on{background:var(--accent);color:var(--accent-fg)}
.days i.today{outline:2px solid var(--fg);outline-offset:1px}
.days p{grid-column:1/-1;margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:40ch}

.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;height:50px;padding:0 6px;font-weight:600;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:380px){.btn{font-size:14px}}

.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:rgba(10,12,11,.5);
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:fade .15s ease}
.sheet .card{width:100%;max-width:420px;background:var(--surface);color:var(--fg);border-radius:22px;padding:22px 20px 16px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:up .2s ease}
.sheet h2{margin:0;font:700 20px/1.25 var(--f-ui);text-wrap:balance}
.sheet p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.sheet .acts button{height:50px;border-radius:14px;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--bg)}
.sheet .acts .go{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sheet .acts .go.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--fg);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s ease;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translate(var(--tx,0),16px);opacity:0}}
.toast{--tx:-50%}
.btn:disabled{opacity:.4;cursor:default}

@media (max-height:640px){.press{min-height:100px}.cell{--h:62px}.days{min-height:90px}}
@media (prefers-reduced-motion:reduce){.strip,.press,.bar i{transition:none}.sheet,.sheet .card,.toast{animation:none}}
</style>

<main class="app">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Çeteleler"></nav>
  <div class="head">
    <div class="headtop">
      <span class="eyebrow" id="eyebrow">Çetele</span>
      <div class="seg" role="group" aria-label="Tür">
        <button id="mTally" aria-pressed="true">Sayaç</button>
        <button id="mDays" aria-pressed="false">Gün</button>
      </div>
    </div>
    <input class="name" id="name" aria-label="Çetele adı" maxlength="40" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="meter" id="meter" role="status" aria-live="polite"></div>
  <div class="sub"><span id="unit">sayıldı</span><span id="info"></span></div>
  <div class="goal" id="goal">
    <div class="goalrow">
      <div class="fields">
        <label for="target" id="targetLbl">Hedef <input id="target" type="number" inputmode="numeric" min="1" max="99999" placeholder="yok" enterkeyhint="done"></label>
        <label for="start" id="startLbl" hidden>Başlangıç <input id="start" type="date"></label>
      </div>
      <span id="left"></span>
    </div>
    <div class="bar" id="bar" hidden><i id="fill"></i></div>
  </div>
  <button class="press" id="press" aria-label="Bir say"><span id="pressNum">+1</span><small id="pressLbl">bas</small></button>
  <div class="days" id="days" hidden></div>
  <div class="row">
    <button class="btn" id="undo">Geri al</button>
    <button class="btn" id="reset">Sıfırla</button>
    <button class="btn" id="del">Sil</button>
  </div>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <div class="card">
    <h2 id="sheetT"></h2>
    <p id="sheetP"></p>
    <div class="acts"><button id="sheetNo">Vazgeç</button><button class="go" id="sheetGo"></button></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(()=>{
  const KEY='cetele.v1', MAX=99999, DAY=864e5;
  const $=id=>document.getElementById(id);
  const tabs=$('tabs'), nameEl=$('name'), targetEl=$('target'), startEl=$('start'), meter=$('meter');
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const todayIso=()=>iso(new Date());
  const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const fmt=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'});

  function load(){
    try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&Array.isArray(s.counters)&&s.counters.length) return s;}catch(e){}
    return {active:'a',counters:[{id:'a',name:'Çetele 1',mode:'tally',value:0,target:null,last:null}]};
  }
  let state=load();
  state.counters.forEach(c=>{c.mode=c.mode||'tally'; if(c.mode==='days'&&!c.start) c.start=todayIso();});
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
  const cur=()=>state.counters.find(c=>c.id===state.active)||state.counters[0];

  // Gösterilecek sayı ve durum
  function view(c){
    const t=c.target||null;
    if(c.mode==='days'){
      const el=Math.round((parse(todayIso())-parse(c.start))/DAY); // geçen gün
      if(el<0) return {n:t||0,unit:t?'gün kaldı':'gün oldu',el,t,future:-el,done:false};
      if(t) return {n:Math.max(0,t-el),unit:'gün kaldı',el,t,done:el>=t};
      return {n:el,unit:'gün oldu',el,t,done:false};
    }
    if(t) return {n:Math.max(0,t-c.value),unit:'kaldı',el:c.value,t,done:c.value>=t};
    return {n:c.value,unit:'sayıldı',el:c.value,t,done:false};
  }

  function renderTabs(){
    tabs.innerHTML='';
    state.counters.forEach(c=>{
      const v=view(c), b=document.createElement('button');
      b.className='tab'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected',String(c.id===cur().id));
      b.innerHTML='<span class="t"></span><span class="n"></span>';
      b.querySelector('.t').textContent=c.name||'Adsız';
      b.querySelector('.n').textContent=v.done?'✓':(c.mode==='days'?v.n+'g':v.n);
      b.onclick=()=>{state.active=c.id;save();render()};
      tabs.appendChild(b);
    });
    const a=document.createElement('button');
    a.className='tab add'; a.textContent='+ Yeni';
    a.onclick=()=>{
      const c={id:uid(),name:'Çetele '+(state.counters.length+1),mode:'tally',value:0,target:null,last:null};
      state.counters.push(c); state.active=c.id; save(); render();
      requestAnimationFrame(()=>tabs.scrollTo({left:tabs.scrollWidth,behavior:'smooth'}));
    };
    tabs.appendChild(a);
  }

  function renderMeter(n,width){
    const s=String(n).padStart(width,'0');
    if(meter.children.length!==s.length){
      meter.innerHTML='';
      for(let i=0;i<s.length;i++){
        const cell=document.createElement('div'); cell.className='cell';
        const st=document.createElement('div'); st.className='strip';
        for(let d=0;d<10;d++){const sp=document.createElement('span');sp.textContent=d;st.appendChild(sp)}
        cell.appendChild(st); meter.appendChild(cell);
      }
    }
    [...meter.children].forEach((cell,i)=>cell.firstChild.style.setProperty('--d',s[i]));
  }

  function renderDays(c,v){
    const box=$('days');
    if(!v.t){box.innerHTML='<p>Gün sayısı girersen (ör. 10) her gün bir kutu dolar ve sayaç 10\'dan geriye düşer.</p>';return}
    const n=Math.min(v.t,1000), frag=document.createDocumentFragment();
    for(let i=0;i<n;i++){
      const d=document.createElement('i'); d.textContent=i+1;
      if(i<v.el) d.className='on';
      if(i===v.el) d.classList.add('today');
      frag.appendChild(d);
    }
    box.innerHTML=''; box.appendChild(frag);
  }

  function render(){
    const c=cur(), v=view(c), days=c.mode==='days';
    renderTabs();
    if(document.activeElement!==nameEl) nameEl.value=c.name;
    if(document.activeElement!==targetEl) targetEl.value=c.target||'';
    if(days&&document.activeElement!==startEl) startEl.value=c.start;
    $('eyebrow').textContent='Çetele No. '+(state.counters.indexOf(c)+1)+' / '+state.counters.length;
    $('mTally').setAttribute('aria-pressed',String(!days));
    $('mDays').setAttribute('aria-pressed',String(days));

    renderMeter(v.n, Math.max(days?2:4, String(v.t||0).length, String(v.n).length));
    meter.setAttribute('aria-label',v.n+' '+v.unit);
    $('unit').textContent=v.unit;

    // bilgi satırı
    let info='';
    if(days){
      const s=parse(c.start);
      if(v.future) info='başlamasına '+v.future+' gün';
      else if(v.t){const end=new Date(s);end.setDate(end.getDate()+v.t);info=(v.done?'bitti ':'bitiş ')+fmt(end);}
      else info=fmt(s)+'\'den beri';
      if(c.start===todayIso()&&!v.future) info='bugün başladı · '+info;
    } else info=c.last?'son basış '+new Date(c.last).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'henüz basılmadı';
    $('info').textContent=info;

    // hedef
    $('targetLbl').firstChild.nodeValue=days?'Gün ':'Hedef ';
    targetEl.placeholder=days?'ör. 10':'yok';
    $('startLbl').hidden=!days;
    $('bar').hidden=!v.t;
    const g=$('goal');
    g.classList.toggle('done',v.done);
    if(v.t){
      const p=Math.min(100,Math.max(0,v.el)/v.t*100);
      $('fill').style.width=p+'%';
      $('left').textContent=v.done?(days?'Süre doldu ✓':'Hedef tamam ✓'):(days?(v.future?'henüz başlamadı':(v.el+1)+'. gün'):v.el+' / '+v.t)+' · %'+Math.floor(p);
    } else $('left').textContent=days?'':'girersen geriye sayar';

    // alt bölüm
    $('press').hidden=days; $('days').hidden=!days;
    if(days) renderDays(c,v);
    else{
      $('pressNum').textContent=v.t?'−1':'+1';
      $('pressLbl').textContent=v.t?'düş':'say';
      $('press').disabled=!!v.done;
    }
    const startedToday=days&&c.start===todayIso();
    $('undo').textContent=days?(startedToday?'Bugün başladı ✓':'Bugün başlat'):'Geri al';
    $('undo').disabled=days?startedToday:c.value===0;
    $('reset').hidden=days;
    $('del').disabled=state.counters.length<2;
  }

  let wake=null;
  async function keepAwake(){
    try{ if(!wake&&'wakeLock' in navigator){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); } }catch(e){}
  }

  function bump(n){
    const c=cur(); if(c.mode!=='tally') return;
    const cap=c.target||MAX;
    const v=Math.max(0,Math.min(cap,c.value+n));
    if(v===c.value) return;
    const hit=c.target&&c.value<c.target&&v>=c.target;
    c.value=v; c.last=Date.now(); save(); render();
    try{navigator.vibrate&&navigator.vibrate(hit?[40,70,40,70,160]:n>0?12:[8,40,8])}catch(e){}
    keepAwake();
  }

  let onGo=null, lastFocus=null;
  function ask({title,text,go,danger},fn){
    $('sheetT').textContent=title; $('sheetP').textContent=text;
    const g=$('sheetGo'); g.textContent=go; g.classList.toggle('danger',!!danger);
    onGo=fn; lastFocus=document.activeElement; $('sheet').hidden=false; g.focus();
  }
  function closeSheet(){ $('sheet').hidden=true; onGo=null; lastFocus&&lastFocus.focus&&lastFocus.focus(); }
  $('sheetNo').onclick=closeSheet;
  $('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
  $('sheetGo').onclick=()=>{ const f=onGo; closeSheet(); f&&f(); };
  let toastT;
  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.hidden=false;
    clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600);
  }

  function setMode(m){
    const c=cur(); if(c.mode===m) return;
    c.mode=m; c.target=null;
    if(m==='days') c.start=todayIso();
    save(); render();
  }
  $('mTally').onclick=()=>setMode('tally');
  $('mDays').onclick=()=>setMode('days');

  $('press').addEventListener('click',()=>bump(1));
  $('undo').addEventListener('click',()=>{
    const c=cur();
    if(c.mode==='tally') return bump(-1);
    const was=fmt(parse(c.start));
    ask({title:'Sayım bugünden başlasın mı?',
         text:'Başlangıç '+was+' yerine bugün olacak. '+(c.target?'Gösterge yeniden '+c.target+'\'dan geriye sayacak.':'Gün sayısı bugünden itibaren sayılacak.'),
         go:'Bugün başlat'},
      ()=>{c.start=todayIso();save();render();toast(c.target?'Başladı · '+c.target+' gün kaldı':'Başladı · sayım bugünden');});
  });
  $('reset').addEventListener('click',()=>{
    const c=cur();
    ask({title:'"'+c.name+'" sıfırlansın mı?',text:c.target?'Gösterge yeniden '+c.target+'\'dan başlayacak.':'Sayı 0 olacak.',go:'Sıfırla',danger:true},
      ()=>{c.value=0;c.last=null;save();render();toast('Sıfırlandı');});
  });
  $('del').addEventListener('click',()=>{
    if(state.counters.length<2) return;
    const c=cur();
    ask({title:'"'+c.name+'" silinsin mi?',text:'Bu çetele ve sayısı kalıcı olarak silinir.',go:'Sil',danger:true},()=>{
      const i=state.counters.indexOf(c); state.counters.splice(i,1);
      state.active=state.counters[Math.max(0,i-1)].id; save(); render(); toast('Silindi');
    });
  });
  nameEl.addEventListener('input',()=>{cur().name=nameEl.value.trim()||'Adsız';save();renderTabs()});
  targetEl.addEventListener('input',()=>{
    const n=parseInt(targetEl.value,10), c=cur();
    c.target=n>0?Math.min(MAX,n):null;
    if(c.target&&c.mode==='tally') c.value=Math.min(c.value,c.target);
    save(); render();
  });
  startEl.addEventListener('change',()=>{ if(startEl.value){cur().start=startEl.value;save();render()} });
  [nameEl,targetEl].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')el.blur()}));
  document.addEventListener('keydown',e=>{
    if(!$('sheet').hidden){ if(e.key==='Escape') closeSheet(); return; }
    if(e.target.tagName==='INPUT') return;
    if(e.key===' '||e.key==='ArrowUp'||e.key==='Enter'){e.preventDefault();$('press').classList.add('down');bump(1)}
    else if(e.key==='ArrowDown'||e.key==='Backspace'){e.preventDefault();bump(-1)}
  });
  document.addEventListener('keyup',()=>$('press').classList.remove('down'));

  // gün değişince yenile
  let lastDay=todayIso();
  const tick=()=>{ if(todayIso()!==lastDay){lastDay=todayIso();render()} };
  setInterval(tick,30000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){tick(); if(wake===null&&cur().mode==='tally') keepAwake();} });

  try{ if('serviceWorker' in navigator && location.protocol==='https:' && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}

  render();
})();
</script>

</body>
</html>
